purpose:
  stands_in_for: Supabase Data API rooms-table read used by the SClass connectivity probe
  unblocks: Local verification without a hosted project or real credentials
assumptions:
  - id: bounded-select-response
    status: supported
    claim: The Data API supports an API-key-authenticated table select that returns a JSON array, including an empty array.
    reason: Supabase documents the REST table-select contract. The local mock models only this bounded request and does not establish hosted availability or permissions.
    verification: On 2026-11-08, reviewed Supabase Data API and API key documentation. Ran the real FastAPI probe against Postman CLI 1.74.0; its request log recorded select=id and limit=1, an empty-array 200, and a rejected-key 401. The integration test observed connected and error responses respectively. All 15 backend checks passed, including timeout and malformed-response cases against a temporary HTTP server.
    source: https://supabase.com/docs/guides/api; https://supabase.com/docs/guides/getting-started/api-keys; backend/tests/test_app.py; postman/mocks/supabase/default.js
    updated_at: "2026-11-08"
  - id: live-project-access
    status: unknown
    claim: The intended Supabase project and configured server key permit reading public.rooms.
    reason: No project URL or credentials were supplied. The real project has not been contacted. A simulated response cannot establish access to it.
    verification: The browser showed backend online and configuration loaded; clicking Test connection returned setup-needed instructions. Add local credentials and use the menu to settle this claim. Owner-mock discovery was skipped because this CLI does not support postman status; the stand-in was authored from vendor documentation. Orbit discovery was unavailable due to DNS resolution failure.
    source: Config/config.json; .env.example; backend/app/database.py; supabase/schema.sql
    updated_at: "2026-11-08"
  - id: weekly-demand-pagination
    status: supported
    claim: The weekly-demand reader can request filtered view rows using limit and offset and collect pages until an empty response under the documented PostgREST contract.
    reason: PostgREST documents limit/offset query parameters. The real reader was exercised against a synthetic HTTP provider with a row cap smaller than requested, and retained all returned requirements without duplication.
    verification: On 2026-11-10, the 16 teaching-requirement backend tests passed, including real HTTP pagination, target-week and outstanding-demand filters, moved requirements, malformed rows, missing view, duplicate pages, and timeout handling. This was a temporary HTTP test server, not a Postman CLI simulation run; the CLI is unavailable and the existing CLI mock still models only the rooms probe. Owner-mock discovery was not performed.
    source: https://docs.postgrest.org/en/stable/references/api/pagination_count.html; backend/app/scheduling/requirements.py; backend/tests/test_teaching_requirements.py; docs/backend/weekly-teaching-plans.md
    updated_at: "2026-11-10"
  - id: hosted-weekly-demand-view
    status: unknown
    claim: The intended hosted project has the teaching-requirement migration applied and exposes teaching_occurrence_details to the server key through its Data API.
    reason: The migration and access rules have been tested only in local PostgreSQL. The hosted project and Data API schema cache have not been inspected or changed by this task.
    verification: On 2026-11-10, verified recurrence and access locally using PGlite with minimal mocked Supabase Auth. No hosted calls were made. Apply the migration, enter real teaching periods, and verify the authorized reader against the intended project before relying on live results.
    source: supabase/migrations/202611100001_teaching_requirements.sql; supabase/tests/teaching-requirements.test.cjs; docs/backend/weekly-teaching-plans.md
    updated_at: "2026-11-10"
  - id: scheduling-snapshot-rpc
    status: supported
    claim: Under the documented PostgREST RPC contract, the backend can POST a selected Monday and timezone and consume a single complete JSON scheduling snapshot from the local database function.
    reason: PostgREST documents named JSON arguments for RPC POST. The new STABLE function resolves the payload under one database snapshot, and actual PostgreSQL output was consumed by the real backend transport over a controlled HTTP stand-in.
    verification: On 2026-11-10, 32 snapshot SQL checks passed, along with 53 focused loader/weekly-reader tests and 96 full backend tests (one optional simulation check skipped). Assertions verify the single RPC path/body and synthetic authentication headers, roster resolution, week boundaries, immutability, fingerprints, schema-removal compatibility, malformed data, missing RPC, upstream failure, and timeout behavior. No Postman CLI simulation or live provider call was made; the CLI is unavailable. Owner-mock discovery was not performed.
    source: https://docs.postgrest.org/en/stable/references/api/functions.html; https://www.postgresql.org/docs/current/xfunc-volatility.html; supabase/migrations/202611100003_scheduling_snapshot.sql; supabase/tests/scheduling-snapshot.test.cjs; backend/tests/test_scheduling_loader.py
    updated_at: "2026-11-10"
  - id: hosted-scheduling-snapshot-rpc
    status: unknown
    claim: The intended hosted project has the step 4 function installed and its Data API permits the trusted backend key to invoke it.
    reason: The new migration and role grants have only been verified locally. Hosted migration state and PostgREST schema-cache behavior have not been inspected by this task.
    verification: Prepared an additive migration with explicit execute grants and a schema-cache reload notification. Apply it after the teaching-requirement migration and verify the real authorized call before claiming live readiness. Local tests do not establish hosted deployment or concurrent-transaction stress behavior.
    source: supabase/migrations/202611100003_scheduling_snapshot.sql; docs/backend/scheduling-data-loader.md
    updated_at: "2026-11-10"
  - id: scheduling-preview-api
    status: supported
    claim: The real FastAPI preview route loads one read-only snapshot RPC, runs the solver, and returns complete assignments or safe explicit outcomes without booking writes; the served page can ingest and render that response.
    reason: Reused the existing local PostgreSQL-output HTTP stand-in because the Postman CLI is unavailable and its existing mock covers only the rooms probe. No live provider or owner mock discovery was performed.
    verification: On 2026-11-10, 29 focused API tests and 230 full backend tests passed with one optional simulation test skipped. Assertions cover the read-only RPC path, complete results, no private roster IDs, failures and timeouts, input validation, local-development access guards, configured solver options, and bounded concurrent generation with responsive health checks. Ten Node/jsdom page checks passed, including actual served HTML/JS calling the API against a synthetic provider and rendering a solved week and an empty week. Browser app access approval timed out, so visual/browser verification is not claimed. No hosted migration or scheduling request was performed.
    source: backend/tests/test_schedule_preview.py; backend/tests/schedule-preview-ui.test.cjs; backend/tests/serve_schedule_preview.py; docs/backend/schedule-preview-api.md
    updated_at: "2026-11-10"
